# Flutter代码分析配置
# 这个文件定义了代码检查规则,帮助保持代码质量

include: package:flutter_lints/flutter.yaml

# 生成文件不参与检查
# （app_database.g.dart 由 build_runner 生成，里面的 unused_element /
#   unnecessary_null_comparison 无法手改，也没意义）
# 排除之后 `flutter analyze` 才会以 0 退出，打包脚本的硬闸才有意义。
analyzer:
  exclude:
    - "**/*.g.dart"

# 自定义lint规则
linter:
  rules:
    # 推荐使用const构造函数(性能优化)
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    
    # 避免使用print语句(生产环境应使用日志框架)
    avoid_print: true
    
    # 必须使用分号
    always_declare_return_types: true
